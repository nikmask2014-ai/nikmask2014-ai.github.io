<style>
:root{--bg:#f4ead8;--card:#fbf5e8;--ink:#3b2416;--soft:#7a5a43;--acc:#8a4b2a;--line:#d9c3a0;--hero:#e9d691;--bar:#3b2416;--barink:#f4ead8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241710;--card:#2f1f16;--ink:#f1e4cb;--soft:#c2a583;--acc:#e0a46c;--line:#4d3626;--bar:#e9d691;--barink:#2b1a10}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Alegreya Sans',Georgia,sans-serif;font-size:18px;padding-bottom:24px}
.hero{background:#f4ead8;text-align:center;padding:18px 16px 26px;border-bottom:1px solid #d9c3a0}
.hero img{width:min(420px,92%);height:auto;display:block;margin:0 auto}
.hero p{margin:8px 0 0;font-family:Alegreya,Georgia,serif;font-style:italic;color:#7a5a43;font-size:20px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
nav a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;font-weight:500;font-size:16px}
main{max-width:640px;margin:0 auto;padding:8px 16px}
section{margin:30px 0}
h2{font-family:Alegreya,Georgia,serif;font-size:32px;margin:0 0 4px;display:flex;align-items:center;gap:12px;color:var(--acc);letter-spacing:.04em}
h2:after{content:"";flex:1;border-top:2px solid var(--line)}
.ico:empty{display:none}.ico{font-size:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:0 4px 14px rgba(59,36,22,.08)}
.it{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px dotted var(--line)}
.it:last-child{border:0}
.n{font-weight:700;font-size:19px}.d{display:block;color:var(--soft);font-size:15.5px;font-weight:400;margin-top:1px}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.p{font-family:Alegreya,Georgia,serif;font-weight:700;font-size:20px;color:var(--acc);white-space:nowrap}
.grp{display:flex;align-items:center;gap:10px}.gl{flex:1}.br{align-self:stretch;width:14px;margin:14px 0;border:2px solid var(--acc);border-left:0;border-radius:0 14px 14px 0}.grp .p{font-size:24px}.info{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:10px 0 2px;font-size:16px;color:var(--soft);text-align:center}.ph{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:16px;margin:10px 0 12px;box-shadow:0 4px 14px rgba(59,36,22,.15)}.note{color:var(--soft);font-style:italic;font-size:16px;padding:10px 0;text-align:center}
footer{text-align:center;color:var(--soft);padding:24px 16px;font-family:Alegreya,serif;font-style:italic}
.ct{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:16px auto 0;padding:0 12px}.ct a,.ct button{font:inherit;color:#f4ead8;background:#6b3e26;border:0;border-radius:14px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700;padding:9px 0;cursor:pointer;box-shadow:0 3px 10px rgba(59,36,22,.25)}.ct span{font-size:22px}
#m{position:fixed;inset:0;background:rgba(30,16,8,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#m.on{display:flex}
#m div{background:#fbf5e8;color:#3b2416;border-radius:20px;padding:22px;text-align:center;max-width:320px;width:100%}
#q svg{width:100%;height:auto}
#m button{margin-top:12px;font:inherit;font-weight:700;background:#3b2416;color:#f4ead8;border:0;border-radius:99px;padding:8px 26px}
